<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story: nota e destaque</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: {{ink}}; font-family: 'Geist', system-ui, sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 1010px; background: {{tint}}"></div>
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 250px 96px 340px; display: flex; flex-direction: column; gap: 72px">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: {{muted}}">
<span>Resenha</span>
<span>Estante de Leitura</span>
</div>
<div style="display: flex; gap: 52px; align-items: flex-end">
<div style="width: 400px; height: 600px; flex: none; box-sizing: border-box; padding: 34px 30px; border-radius: 8px 16px 16px 8px; background: {{coverBg}}; box-shadow: inset 8px 0 0 {{line}}, 0 2px 4px rgba(0,0,0,0.08), 0 40px 70px -30px rgba(0,0,0,0.45); display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accentText}}">Mente e vieses</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 62px; line-height: 1.02; color: {{ink}}">A Mente Moralista</span>
<span style="font-size: 22px; color: {{muted}}; border-top: 2px solid {{line}}; padding-top: 16px">Jonathan Haidt</span>
</div>
<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0; padding-bottom: 8px">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 92px; line-height: 0.98; letter-spacing: -0.01em">A Mente Moralista</span>
<span style="font-size: 32px; color: {{muted}}">Jonathan Haidt</span>
<span style="font-size: 52px; letter-spacing: 6px; margin-top: 12px; color: {{ink}}">{{stars}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 28px">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 160px; line-height: 0.5; height: 60px; color: {{accentText}}">“</span>
<p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 76px; line-height: 1.08; letter-spacing: -0.005em">Mudou o jeito como eu discuto política em casa: menos tentar vencer, mais entender por que o outro pensa assim.</p>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; border-top: 2px solid {{rule}}; padding-top: 32px">
<div style="display: flex; gap: 48px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 28px; color: {{muted}}">
<span><span style="color: {{ink}}">384</span> págs</span>
<span><span style="color: {{ink}}">12</span> dias</span>
</div>
<span style="font-size: 28px; font-weight: 500">@seu.usuario</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4A5E9E","options":["#4A5E9E","#3E6B5A","#9A6236","#94506F"]},"dark":{"editor":"boolean","default":false},"rating":{"editor":"int","default":4,"min":0,"max":5},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    var rgb = function(h){h=String(h||'').replace('#','');if(h.length===3){h=h.split('').map(function(c){return c+c;}).join('');}var n=parseInt(h,16);if(isNaN(n)){n=0x4A5E9E;}return [(n>>16)&255,(n>>8)&255,n&255];};
    var mix = function(a,b,t){var x=rgb(a),y=rgb(b);return '#'+x.map(function(v,i){return Math.round(v*t+y[i]*(1-t)).toString(16).padStart(2,'0');}).join('');};
    var accent = this.props.accent ?? '#4A5E9E';
    var dark = this.props.dark ?? false;
    var rating = Math.max(0, Math.min(5, this.props.rating ?? 4));
    var bg = dark ? '#111111' : '#F8F8F6';
    return {
      bg: bg,
      ink: dark ? '#EDEDEA' : '#151515',
      muted: dark ? '#A3A39C' : '#5E5E58',
      rule: dark ? '#2E2E2B' : '#DDDDD7',
      tint: mix(accent, bg, dark ? 0.24 : 0.16),
      coverBg: dark ? mix(accent, '#1A1A19', 0.38) : mix(accent, '#FFFFFF', 0.24),
      line: mix(accent, bg, dark ? 0.7 : 0.45),
      accentText: dark ? mix(accent, '#FFFFFF', 0.55) : mix(accent, '#000000', 0.85),
      stars: '★'.repeat(rating) + '☆'.repeat(5 - rating)
    };
  }
}
</script>
</body>
</html>
