<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story: terminei de ler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; position: relative; overflow: hidden; background: {{tint}}; color: {{ink}}; font-family: 'Geist', system-ui, sans-serif">
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 250px 96px 340px; display: flex; flex-direction: column; gap: 64px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accentText}}">Livro 3 de 12 do plano</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 210px; line-height: 0.95; letter-spacing: -0.02em">Terminei<span style="font-style: italic; color: {{accentText}}">.</span></span>
</div>
<div style="display: flex; gap: 52px; align-items: center">
<div style="width: 400px; height: 600px; flex: none; box-sizing: border-box; padding: 34px 30px; border-radius: 8px 16px 16px 8px; background: {{coverBg}}; transform: rotate(-3deg); box-shadow: inset 8px 0 0 {{line}}, 0 2px 4px rgba(0,0,0,0.08), 0 50px 80px -30px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accentText}}">Mente e vieses</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 62px; line-height: 1.02">A Mente Moralista</span>
<span style="font-size: 22px; color: {{muted}}; border-top: 2px solid {{line}}; padding-top: 16px">Jonathan Haidt</span>
</div>
<div style="display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 72px; line-height: 1">A Mente Moralista</span>
<span style="font-size: 30px; color: {{muted}}">Jonathan Haidt</span>
<span style="font-size: 48px; letter-spacing: 6px; margin-top: 8px">{{stars}}</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; border-top: 2px solid {{line}}; padding-top: 36px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 72px; line-height: 1">384</span>
<span style="font-size: 26px; color: {{muted}}">páginas</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 72px; line-height: 1">12</span>
<span style="font-size: 26px; color: {{muted}}">dias</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 72px; line-height: 1">{{ratingText}}</span>
<span style="font-size: 26px; color: {{muted}}">nota</span>
</div>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 24px; color: {{muted}}">Próxima leitura</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 44px; line-height: 1.05">Rápido e Devagar</span>
</div>
<span style="font-size: 28px; font-weight: 500">@seu.usuario</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4A5E9E","options":["#4A5E9E","#3E6B5A","#9A6236","#94506F"]},"dark":{"editor":"boolean","default":false},"rating":{"editor":"int","default":4,"min":0,"max":5},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    var rgb = function(h){h=String(h||'').replace('#','');if(h.length===3){h=h.split('').map(function(c){return c+c;}).join('');}var n=parseInt(h,16);if(isNaN(n)){n=0x4A5E9E;}return [(n>>16)&255,(n>>8)&255,n&255];};
    var mix = function(a,b,t){var x=rgb(a),y=rgb(b);return '#'+x.map(function(v,i){return Math.round(v*t+y[i]*(1-t)).toString(16).padStart(2,'0');}).join('');};
    var accent = this.props.accent ?? '#4A5E9E';
    var dark = this.props.dark ?? false;
    var rating = Math.max(0, Math.min(5, this.props.rating ?? 4));
    var bg = dark ? '#111111' : '#F8F8F6';
    return {
      ink: dark ? '#EDEDEA' : '#151515',
      muted: dark ? '#B0B0A9' : '#4F4F4A',
      tint: mix(accent, bg, dark ? 0.3 : 0.26),
      coverBg: dark ? mix(accent, '#1A1A19', 0.45) : mix(accent, '#FFFFFF', 0.14),
      line: mix(accent, bg, dark ? 0.75 : 0.6),
      accentText: dark ? mix(accent, '#FFFFFF', 0.55) : mix(accent, '#000000', 0.8),
      stars: '★'.repeat(rating) + '☆'.repeat(5 - rating),
      ratingText: rating + '/5'
    };
  }
}
</script>
</body>
</html>
